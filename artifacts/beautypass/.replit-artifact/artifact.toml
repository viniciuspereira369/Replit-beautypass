kind = "web"
previewPath = "/"
title = "BeautyPass"
description = "Marketplace gratuito de beleza em São Paulo, com atendimento presencial nos salões parceiros, descontos em horários econômicos e pagamento por agendamento em reais via Pix ou cartão simulado. Reservas, avaliações verificadas e painel B2B sincronizados localmente no navegador."
version = "1.0.0"
id = "artifacts/beautypass"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25345

[services.development]
run = "pnpm --filter @workspace/beautypass run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/beautypass", "run", "build" ]
serve = "static"
publicDir = "artifacts/beautypass/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25345"
BASE_PATH = "/"
